<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c17"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Beer Shop Manager</title>
<style>
:root{color-scheme:dark;--bg:#080c17;--card:#121929;--c2:#1a2338;--tx:#eef1f8;--mut:#8b96b0;--g:#34d399;--r:#f87171;--a:#fbbf24;--bd:#243049;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,#16213d,var(--bg));background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto}
h1{font-size:19px;margin:4px 0 12px}h2{font-size:12px;margin:20px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px}
.card{background:linear-gradient(160deg,#151d30,var(--card));border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px #0007}
.hero{background:linear-gradient(145deg,#0f3d33,#112038 70%);border:1px solid #1d5a49;border-radius:22px;padding:18px;margin-bottom:12px}
.hs{font-size:42px;font-weight:800;line-height:1.1;margin:6px 0;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.lbl{color:var(--mut);font-size:12px}.big{font-size:21px;font-weight:700;margin-top:3px}
.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mut)}.a{color:var(--a)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.l{justify-content:flex-start}
.pill{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.pill button{white-space:nowrap;min-height:38px;padding:7px 14px;border-radius:20px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;min-height:44px}
input,select,textarea{width:100%}button{cursor:pointer}
button.on,button.pri{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#1a1200;border-color:#f59e0b;font-weight:700}button.dng{color:var(--r)}button:disabled{opacity:.45}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b1120f2;border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mut);padding:6px 2px;min-height:48px}nav button span{display:block;font-size:21px}nav button.on{color:var(--a);background:none}
.bar{height:7px;background:var(--c2);border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399)}
.th{width:42px;height:42px;border-radius:13px;background:var(--c2);display:grid;place-items:center;font-size:20px;flex:none}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto}
.sheet label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
.ban{background:#3a2a0e;color:var(--a);padding:10px 12px;border-radius:14px;margin-bottom:10px;font-size:13px}.ban.e{background:#3b1517;color:var(--r)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.toast{position:fixed;left:14px;right:14px;bottom:100px;background:#22304d;border:1px solid var(--bd);padding:12px;border-radius:14px;z-index:30;text-align:center}
.mi{text-align:left;padding:16px;display:flex;flex-direction:column;gap:4px;border-radius:18px}.mi span{font-size:24px}
@media print{nav,.np{display:none!important}:root{--bg:#fff;--card:#fff;--c2:#fff;--tx:#000;--mut:#444;--bd:#bbb;--g:#060;--r:#a00;--a:#850}html,body{background:#fff!important}.card,.hero{box-shadow:none;background:#fff;border:1px solid #bbb}}
</style></head><body>
<main id="app"><div class="card m">Loading…</div></main><nav id="nav"></nav>
<script>
const URL_='https://mkdvgnvrnmutrgsweien.supabase.co',KEY='sb_publishable_IPRWNONrrtRwp8fRnkIiEg_pcL8fSX2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>(n<0?'−':'')+'₹'+(Math.abs(Math.round((+n||0)*100)/100)).toLocaleString('en-IN');
const r2=n=>Math.round(n*100)/100,pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ds(d)};
const uuid=()=>crypto.randomUUID();
const wn=v=>Number.isInteger(v)&&v>=0;
const EM={INSUFFICIENT_GODOWN:'Godown me itna stock nahi hai',DAY_CLOSED:'Aaj ka din close ho chuka hai',NEGATIVE_SALES:'Closing stock available stock se zyada hai',MISSING_CLOSING:'Har product ka closing stock daalo',ADMIN_ONLY:'Sirf admin ye kar sakta hai',DAY_LOCKED:'Ye din locked hai, badla nahi ja sakta',SETUP_PENDING:'Pehle setup poora karo',BAD_QUANTITY:'Quantity galat hai',NOT_ALLOWED:'Aapko permission nahi hai',SETUP_ALREADY_DONE:'Setup pehle hi ho chuka hai','Failed to fetch':'Internet nahi hai. Kuch save nahi hua.'};
const emsg=e=>{const m=e.message||String(e);for(const k in EM)if(m.includes(k))return EM[k];return m};
let tok=null,rt=null,uid=null,role=null,email='',P=[],PR={},CO={},ST={},SETUP=false,TODAY=null,DAY=null,LINES=[],RECON=null,RDAY=null,RLINES=[],H=null,G={},tab='home',sub=null,R='today',cf=null,ct=null,ready=false,busyA=false,DR={},PL={},WZ={},wz=1,RID=null,LOGIN_ERR='';
const pn=p=>p.brand+' '+p.size_ml+'ml',isAdmin=()=>role==='admin';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function sheet(h){closeSheet(true);const s=document.createElement('div');s.className='sheet';s.id='sheet';s.innerHTML='<div>'+h+'</div>';s.onclick=e=>{if(e.target===s)closeSheet()};document.body.appendChild(s)}
function closeSheet(q){const s=$('#sheet');if(s)s.remove();if(!q)render()}
// ---------- network ----------
async function api(path,o={}){const h={apikey:KEY,'Content-Type':'application/json',...(o.headers||{})};if(tok)h.Authorization='Bearer '+tok;
 const r=await fetch(URL_+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){if(r.status===401&&!o.retry&&await refresh())return api(path,{...o,retry:1});throw new Error(j?.message||j?.msg||j?.error_description||r.statusText)}return j}
const sel=(t,q='')=>api('/rest/v1/'+t+'?'+q),rpc=(n,a={})=>api('/rest/v1/rpc/'+n,{method:'POST',body:a});
const ins=(t,b)=>api('/rest/v1/'+t,{method:'POST',body:b,headers:{Prefer:'return=minimal'}}),patch=(t,q,b)=>api('/rest/v1/'+t+'?'+q,{method:'PATCH',body:b,headers:{Prefer:'return=minimal'}}),del=(t,q)=>api('/rest/v1/'+t+'?'+q,{method:'DELETE',headers:{Prefer:'return=minimal'}});
function save(j){tok=j.access_token;rt=j.refresh_token;uid=j.user?.id||uid;localStorage.setItem('bsm_s',JSON.stringify({rt,uid}))}
async function refresh(){if(!rt)return false;try{const r=await fetch(URL_+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!r.ok)return false;save(await r.json());return true}catch(e){return false}}
async function login(){const e=$('#em').value.trim(),p=$('#pw').value;LOGIN_ERR='';try{const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description||'Login failed');save(j);await loadAll()}catch(x){LOGIN_ERR=x.message==='Failed to fetch'?'Internet nahi hai':'Email ya password galat hai';render()}}
function logout(){tok=rt=uid=role=null;localStorage.removeItem('bsm_s');ready=false;render()}
// ---------- data ----------
const latest=(rows,k)=>{const o={};rows.forEach(x=>{if(!(x.product_id in o))o[x.product_id]=x[k]});return o};
async function loadAll(){
 const pf=await sel('profiles',`select=role,email&id=eq.${uid}`);role=pf[0]?.role||'pending';email=pf[0]?.email||'';
 if(role==='pending'){ready=true;return render()}
 const [pr,pp,st,se]=await Promise.all([sel('products','select=*&order=sort'),sel('product_prices','select=product_id,price&order=effective_from.desc,id.desc'),sel('stock','select=*'),sel('settings','select=*')]);
 P=pr;PR=latest(pp,'price');ST={};st.forEach(x=>ST[x.product_id]=x);SETUP=se.some(x=>x.key==='setup_done');
 if(isAdmin()){CO=latest(await sel('product_costs','select=product_id,cost&order=effective_from.desc,id.desc'),'cost')}
 RECON=null;
 if(SETUP){try{TODAY=await rpc('ensure_today')}catch(e){const m=/UNCLOSED_DAY:(\d{4}-\d\d-\d\d)/.exec(e.message);if(m)RECON=m[1];else throw e}
  const d=RECON||TODAY;const [dy,ln]=await Promise.all([sel('days',`business_date=eq.${d}&select=*`),sel('day_lines',`business_date=eq.${d}&select=*`)]);
  if(RECON){RDAY=dy[0];RLINES=ln}else{DAY=dy[0];LINES=ln}
  await loadHist()}
 ready=true;render()}
function rng(k){const t=addDays(0),d=new Date();return{today:[t,t],yesterday:[addDays(-1),addDays(-1)],'7':[addDays(-6),t],'30':[addDays(-29),t],month:[ds(new Date(d.getFullYear(),d.getMonth(),1)),t],year:[d.getFullYear()+'-01-01',t],custom:[cf||t,ct||t]}[k]}
async function loadHist(){const [f,t]=rng(R),q=`business_date=gte.${f}&business_date=lte.${t}`;
 const [days,lines]=await Promise.all([sel('days',`status=eq.closed&${q}&select=*&order=business_date.desc`),sel('day_lines',`${q}&select=*`)]);
 H={days,lines,costs:[],exp:[],adj:[]};
 if(isAdmin()){[H.costs,H.exp,H.adj]=await Promise.all([sel('day_line_costs',`${q}&select=*`),sel('expenses',`expense_date=gte.${f}&expense_date=lte.${t}&select=*`),sel('profit_adjustments',`adj_date=gte.${f}&adj_date=lte.${t}&select=*`)])}}
async function act(fn,ok){if(busyA)return;busyA=true;try{const r=await fn();if(ok)toast(typeof ok==='function'?ok(r):ok);await loadAll();return true}catch(e){toast(emsg(e));render()}finally{busyA=false}}
function agg(){const o={rev:0,bt:0,cogs:0,inc:false,exp:0,adj:0,byP:{},byB:{}},cm={};H.costs.forEach(c=>cm[c.business_date+c.product_id]=c.cost);
 H.days.forEach(d=>{o.rev+=+d.total_sales;o.bt+=d.total_bottles});
 H.lines.forEach(l=>{if(!l.sold)return;const p=P.find(x=>x.id===l.product_id);if(!p)return;const x=o.byP[p.id]||(o.byP[p.id]={q:0,rev:0,cogs:0,inc:false});x.q+=l.sold;x.rev+=l.sold*l.price;
  const c=cm[l.business_date+l.product_id];if(c>0)x.cogs+=l.sold*c;else x.inc=true;const b=o.byB[p.brand]||(o.byB[p.brand]={q:0,rev:0});b.q+=l.sold;b.rev+=l.sold*l.price});
 Object.values(o.byP).forEach(x=>{o.cogs+=x.cogs;if(x.inc)o.inc=true});H.exp.forEach(e=>o.exp+=+e.amount);H.adj.forEach(a=>o.adj+=+a.amount);
 o.gross=o.rev-o.cogs;o.net=o.gross-o.exp;o.fin=o.net+o.adj;return o}
const prof=o=>o.inc?'<span class="a">incomplete – cost missing</span>':inr(o.gross);
const thumb=p=>'<div class="th">'+(p.size_ml==180?'🍊':'🍺')+'</div>';
// ---------- wizard ----------
const W=(k,id,v)=>{(WZ[k]=WZ[k]||{})[id]=v};
function G3(id){W('gc',id,$('#gc'+id).value);W('gl',id,$('#gl'+id).value)}
function wv(p){const g=k=>WZ[k]?.[p.id],cs=+(g('case')??p.case_size),s=ST[p.id]||{godown:0,fridge:0};return{price:+(g('price')??PR[p.id]),cost:+(g('cost')??CO[p.id]),cs,gb:(g('gc')===undefined&&g('gl')===undefined)?s.godown:(+(g('gc')||0)*cs+(+(g('gl')||0))),fr:g('fr')===undefined?s.fridge:+g('fr')}}
function wzv(){if(!isAdmin())return '<div class="card"><h1>Setup pending</h1><p class="m">Owner ko pehle first-time setup poora karna hai.</p></div>';
 const S=['Prices','Godown','Fridge','Review'];let h=`<div class="pill">${S.map((x,i)=>`<button class="${wz===i+1?'on':''}" disabled>${i+1}. ${x}</button>`).join('')}</div>`;
 if(wz===1)h+='<div class="card"><h1>First-time Setup</h1><p class="m">13 products ready hain. Prices, costs aur case size check karo.</p></div>'+P.map(p=>`<div class="card"><b>${esc(pn(p))}</b><div class="f3"><div><div class="lbl">Sell ₹</div><input type="number" step="0.01" value="${wv(p).price}" oninput="W('price','${p.id}',this.value)"></div><div><div class="lbl">Cost ₹</div><input type="number" step="0.01" value="${wv(p).cost}" oninput="W('cost','${p.id}',this.value)"></div><div><div class="lbl">Bottles/case</div><input type="number" value="${wv(p).cs}" oninput="W('case','${p.id}',this.value)"></div></div></div>`).join('');
 else if(wz===2)h+='<div class="lbl" style="margin-bottom:8px">Abhi godown me kitna stock hai (product-wise)</div>'+P.map(p=>{const w=wv(p);return `<div class="card"><b>${esc(pn(p))}</b><div class="f2"><div><div class="lbl">Cases (${w.cs}/case)</div><input id="gc${p.id}" type="number" min="0" step="1" inputmode="numeric" value="${WZ.gc?.[p.id]??Math.floor(w.gb/w.cs)}" oninput="G3('${p.id}')"></div><div><div class="lbl">Loose bottles</div><input id="gl${p.id}" type="number" min="0" step="1" inputmode="numeric" value="${WZ.gl?.[p.id]??w.gb%w.cs}" oninput="G3('${p.id}')"></div></div></div>`}).join('');
 else if(wz===3)h+='<div class="lbl" style="margin-bottom:8px">Fridge me abhi kitni bottles hain (sirf ek baar)</div>'+P.map(p=>`<div class="card"><div class="row"><b>${esc(pn(p))}</b><input type="number" min="0" step="1" inputmode="numeric" style="width:110px" value="${wv(p).fr}" oninput="W('fr','${p.id}',this.value)"></div></div>`).join('');
 else h+='<h1>Review</h1>'+P.map(p=>{const w=wv(p);return `<div class="card"><b>${esc(pn(p))}</b><div class="lbl">Sell ${inr(w.price)} · Cost ${inr(w.cost)} · Godown ${Math.floor(w.gb/w.cs)} cases + ${w.gb%w.cs} = ${w.gb} · Fridge ${w.fr}</div></div>`}).join('');
 return h+`<div class="row" style="margin-top:12px"><button ${wz==1?'disabled':''} onclick="wz--;render()">‹ Back</button>${wz<4?`<button class="pri" onclick="wz++;render()">Next ›</button>`:`<button class="pri" onclick="finishSetup()">Final Setup &amp; Save</button>`}</div>`}
async function finishSetup(){const st=[];for(const p of P){const w=wv(p);if(!(w.price>=0)||!(w.cost>0)||!wn(w.cs)||w.cs<1||!wn(w.gb)||!wn(w.fr))return toast(pn(p)+': values check karo (cost 0 se zyada, poore numbers)');st.push({product_id:p.id,godown:w.gb,fridge:w.fr})}
 if(!confirm('Final Setup & Save? Opening stock dobara enter nahi hoga.'))return;
 await act(async()=>{for(const p of P){const w=wv(p);if(w.cs!==p.case_size)await patch('products','id=eq.'+p.id,{case_size:w.cs});await rpc('admin_set_price',{p_product:p.id,p_price:w.price,p_cost:w.cost})}await rpc('complete_setup',{p_stock:st})},'Setup poora hua!')}
// ---------- daily ----------
function calc(id,l){const c=$('#c'+id).value,el=$('#s'+id),j=$('#j'+id).value;DR[id]={c,j};if(c===''){el.textContent='—';el.className='m';return}const v=l.opening+l.transfers_in-(+j||0)-(+c);el.textContent=v<0||+c<0?'Mismatch!':v+' sold';el.className=v<0||+c<0?'r':'g'}
function closeForm(lines,date){return `<div class="lbl" style="margin-bottom:8px">Available = Opening + transfers. Sold = Available − Closing − Damaged.</div>`+P.map(p=>{const l=lines.find(x=>x.product_id===p.id);if(!l)return'';const dr=DR[p.id]||{};return `<div class="card"><div class="row"><div class="row l">${thumb(p)}<div><b>${esc(pn(p))}</b><div class="lbl">${inr(PR[p.id])}</div></div></div><b id="s${p.id}" class="m">—</b></div>
<div class="f3" style="margin-top:8px"><div><div class="lbl">Opening 🔒</div><input value="${l.opening}" disabled></div><div><div class="lbl">+ Transfers</div><input value="${l.transfers_in}" disabled></div><div><div class="lbl">Available</div><input value="${l.opening+l.transfers_in}" disabled></div></div>
<div class="f2" style="margin-top:6px"><div><div class="lbl">Closing stock</div><input id="c${p.id}" type="number" min="0" step="1" inputmode="numeric" value="${dr.c??''}" oninput="calc('${p.id}',LL('${p.id}'))"></div><div><div class="lbl">Damaged / comp. (not sales)</div><input id="j${p.id}" type="number" min="0" step="1" inputmode="numeric" value="${dr.j??''}" oninput="calc('${p.id}',LL('${p.id}'))"></div></div></div>`}).join('')+`<button class="pri" style="width:100%" onclick="reviewClose('${date}')">Save &amp; Close ${date===TODAY?"Today's Business":'This Day'}</button>`}
const LL=id=>(RECON?RLINES:LINES).find(x=>x.product_id===id);
function reviewClose(date){const lines=RECON?RLINES:LINES,out=[];let rev=0,bt=0,cg=0,inc=false;
 for(const p of P){const l=lines.find(x=>x.product_id===p.id);if(!l)continue;const cv=$('#c'+p.id).value;if(cv==='')return toast(pn(p)+': closing stock daalo');const cl=+cv,j=+$('#j'+p.id).value||0;
  if(!wn(cl)||!wn(j))return toast(pn(p)+': poore numbers daalo');const v=l.opening+l.transfers_in-j-cl;if(v<0)return toast(pn(p)+': closing available stock se zyada hai ('+(l.opening+l.transfers_in-j)+')');
  out.push({product_id:p.id,closing:cl,adjustments:j,sold:v,name:pn(p)});rev+=v*PR[p.id];bt+=v;if(isAdmin()){if(CO[p.id]>0)cg+=v*CO[p.id];else inc=true}}
 window.CLP={date,out};RID=null;
 sheet(`<h1>Confirm Closing${date!==TODAY?' ('+date+')':''}</h1><div class="card"><div class="row"><span class="lbl">Bottles sold</span><b>${bt}</b></div><div class="row"><span class="lbl">Total sales</span><b class="g">${inr(rev)}</b></div>${isAdmin()?`<div class="row"><span class="lbl">Beer cost</span><b>${inr(-cg)}</b></div><div class="row"><span class="lbl">Gross profit</span><b>${inc?'<span class="a">cost missing</span>':inr(rev-cg)}</b></div>`:''}</div>
<div class="card">${out.map(x=>`<div class="row lbl"><span>${esc(x.name)}</span><span>Close ${x.closing} · Sold ${x.sold}</span></div>`).join('')}</div>${date!==TODAY?'<p class="a lbl">Ye din pehle band nahi hua tha. Sales physical count se nikli hain aur kai din ki ho sakti hain. Din “reconciled” mark hoga.</p>':''}
<p class="a lbl">Save ke baad ye din hamesha ke liye lock ho jayega.</p><div class="row"><button onclick="closeSheet()">Back</button><button class="pri" onclick="doClose()">Save &amp; Close</button></div>`)}
async function doClose(){const c=window.CLP;closeSheet(true);const ok=await act(()=>rpc('close_day',{p_date:c.date,p_lines:c.out.map(x=>({product_id:x.product_id,closing:x.closing,adjustments:x.adjustments}))}),r=>r.status==='already_closed'?'Ye din pehle hi close hai':`Business closed successfully! ${r.bottles} bottles, ${inr(r.sales)}`);if(ok)DR={}}
function qForm(){RID=uuid();sheet(`<h1>Add Stock to Fridge</h1><label>Product</label><select id="f_p" onchange="hint()"><option value="">Select…</option>${P.map(p=>`<option value="${p.id}">${esc(pn(p))}</option>`).join('')}</select>
<div class="f2"><div><label>Cases</label><input id="f_c" type="number" min="0" step="1" inputmode="numeric" oninput="hint()"></div><div><label>Loose bottles</label><input id="f_l" type="number" min="0" step="1" inputmode="numeric" oninput="hint()"></div></div><div id="hint" class="a" style="margin-top:8px"></div>

function hint(){const p=P.find(x=>x.id===$('#f_p').value);if(!p){$('#hint').textContent='';return}const g=ST[p.id].godown,b=(+$('#f_c').value||0)*p.case_size+(+$('#f_l').value||0);$('#hint').textContent=`Godown: ${Math.floor(g/p.case_size)} cases + ${g%p.case_size} loose (${g} bottles). Transfer = ${b} bottles.`}

async function doPur(){const pid=$('#f_p').value,c=+$('#f_c').value||0,l=+$('#f_l').value||0,cost=+$('#f_cost').value||0;if(!pid)return toast('Product chuno');if(!wn(c)||!wn(l)||c+l<=0)return toast('Poore numbers daalo');if(cost<=0)return toast('Purchase cost daalo');
 const a={p_request_id:RID,p_product:pid,p_cases:c,p_loose:l,p_cost:cost,p_mode:$('#f_m').value,p_supplier:$('#f_s').value,p_notes:$('#f_n').value,p_date:$('#f_d').value};closeSheet(true);await act(()=>rpc('add_purchase',a),r=>r.status==='duplicate'?'Ye purchase pehle hi save hai':`${r.bottles} bottles godown me add hue`)}
function expense(){const cs=[...new Set(['Rent','Electricity','Salary','Transport','Maintenance','Other',...(G.ex||[]).map(e=>e.category)])];return back+`<button class="pri" style="width:100%;margin-bottom:10px" onclick="expForm()">＋ Add Expense</button><datalist id="cl">${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist>`+((G.ex||[]).map(e=>`<div class="card"><div class="row"><div><b>${esc(e.name)}</b><div class="lbl">${e.expense_date} · ${esc(e.category)}${e.notes?' · '+esc(e.notes):''}</div></div><div class="row"><b class="r">${inr(-e.amount)}</b><button class="dng" style="min-height:36px;padding:4px 10px" onclick="delExp('${e.id}')">🗑</button></div></div></div>`).join('')||'<div class="card m">Koi expense nahi.</div>')}
function expForm(){sheet(`<h1>Add Expense</h1><label>Name</label><input id="x_n"><div class="f2"><div><label>Amount ₹</label><input id="x_a" type="number" min="0" step="0.01" inputmode="decimal"></div><div><label>Date</label><input id="x_d" type="date" value="${addDays(0)}"></div></div><label>Category</label><input id="x_c" list="cl" value="Other"><label>Notes</label><input id="x_t"><div class="row" style="margin-top:14px"><button onclick="closeSheet()">Cancel</button><button class="pri" onclick="saveExp()">Save</button></div>`)}
async function saveExp(){const n=$('#x_n').value.trim(),a=+$('#x_a').value,d=$('#x_d').value;if(!n||!(a>0)||!d)return toast('Name, amount, date daalo');const b={expense_date:d,name:n,category:$('#x_c').value.trim()||'Other',amount:a,notes:$('#x_t').value};closeSheet(true);await act(()=>ins('expenses',b),'Expense saved');go('expense')}
async function delExp(id){const e=G.ex.find(x=>x.id===id);if(!confirm('Delete "'+e.name+'" '+inr(e.amount)+'?'))return;await act(()=>del('expenses','id=eq.'+id),'Deleted');go('expense')}
function adjust(){const d=G.d,c=G.c,ex=(G.e||[]).reduce((s,x)=>s+ +x.amount,0),adj=(G.a||[]).reduce((s,x)=>s+ +x.amount,0),ok=d&&d.status==='closed'&&c,gross=ok?d.total_sales-c.total_cogs:0,net=gross-ex;
 return back+`<div class="card"><h1>Profit Adjustment (aaj, ${TODAY})</h1>${ok?`<div class="row"><span class="lbl">Gross profit</span><b>${inr(gross)}</b></div><div class="row"><span class="lbl">Expenses</span><b class="r">${inr(-ex)}</b></div><div class="row"><span class="lbl">Net profit (calculated)</span><b>${inr(net)}</b></div><div class="row"><span class="lbl">Adjustments</span><b>${inr(adj)}</b></div><div class="row"><b>Final profit</b><b class="g">${inr(net+adj)}</b></div>`:'<div class="ban">Aaj ka din close hone ke baad adjustment kar sakte ho. Purane din locked hain.</div>'}</div>`+(ok?`<div class="card"><label class="lbl">Adjustment (+ ya −) ₹</label><input id="j_a" type="number" step="0.01" inputmode="decimal"><label class="lbl" style="margin-top:8px">…ya desired final profit ₹</label><input id="j_d" type="number" step="0.01" inputmode="decimal"><label class="lbl" style="margin-top:8px">Reason</label><input id="j_n"><button class="pri" style="width:100%;margin-top:10px" onclick="saveAdj(${net+adj})">Save Adjustment</button></div>`:'')+'<h2>Audit trail</h2>'+((G.a||[]).map(a=>`<div class="card"><b class="${a.amount<0?'r':'g'}">${inr(a.amount)}</b> <span class="lbl">${new Date(a.created_at).toLocaleString('en-IN')} · ${esc(a.note)}</span></div>`).join('')||'<div class="card m">Koi nahi.</div>')}
async function saveAdj(cur){const dv=$('#j_d').value,amt=r2(dv!==''?(+dv)-cur:+$('#j_a').value),note=$('#j_n').value.trim();if(!amt)return toast('Kuch adjust nahi hua');if(!note)return toast('Reason likho');if(!confirm('Adjustment '+inr(amt)+' save karein?'))return;await act(()=>rpc('add_profit_adjustment',{p_amount:amt,p_note:note}),'Saved');go('adjust')}
function users(){return back+'<div class="lbl" style="margin-bottom:8px">Naye signup “pending” rehte hain. Approve karne ke liye role chuno.</div>'+(G.us||[]).map(u=>`<div class="card"><div class="row"><span>${esc(u.email)}</span><select style="width:130px" onchange="setRole('${u.id}',this.value)" ${u.id===uid?'disabled':''}>${['admin','staff','pending'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div>`).join('')}
async function setRole(id,r){if(!confirm('Role “'+r+'” set karein?'))return go('users');await act(()=>rpc('admin_set_role',{p_user:id,p_role:r}),'Role badla');go('users')}
function backup(){return back+`<div class="card"><h1>Backup</h1><p class="m">Poora data ek file me download hoga. Roz ya hafte me ek baar karo aur file phone ke bahar (Google Drive/WhatsApp) bhi save karo. Free Supabase plan me automatic backup nahi hota.</p><button class="pri" style="width:100%" onclick="doBackup()">⬇ Download Backup</button><p class="lbl">Restore abhi banaya nahi hai.</p></div>`}
async function doBackup(){await act(async()=>{const j=await rpc('export_backup');dl('beer-backup-'+addDays(0)+'.json',JSON.stringify(j,null,1),'application/json')},'Backup download hua')}
function logs(){return back+'<div class="card">'+((G.lg||[]).map(x=>`<div class="lbl" style="margin-bottom:6px">${new Date(x.ts).toLocaleString('en-IN')} · <b>${esc(x.action)}</b></div>`).join('')||'<span class="m">—</span>')+'</div>'}
// ---------- shell ----------
function setTab(t){tab=t;sub=null;render()}
function render(){const ae=document.activeElement;if($('#sheet'))return;if(ae&&ae.tagName==='INPUT'&&!ae.disabled&&ae.type==='number'&&ready)return;
 const off=!navigator.onLine?'<div class="ban e">Offline — save nahi hoga jab tak internet na aaye.</div>':'';
 const hd=`<div class="row np"><h1>🍺 Beer Shop Manager</h1><span>${tok&&isAdmin()&&SETUP?`<button onclick="tab='admin';sub=null;render()" aria-label="Admin" style="min-height:40px;padding:6px 12px;opacity:.75">⚙️</button> `:''}${tok?`<button onclick="logout()" style="min-height:40px;padding:6px 12px;opacity:.75" aria-label="Logout">⎋</button>`:''}</span></div>${off}`;
 if(!tok){$('#nav').innerHTML='';$('#app').innerHTML=`<h1 style="margin-top:40px;text-align:center">🍺 Beer Shop Manager</h1><div class="card"><label class="lbl">Email</label><input id="em" type="email" autocomplete="username"><label class="lbl" style="margin-top:8px">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="r" style="margin:8px 0">${esc(LOGIN_ERR)}</div><button class="pri" style="width:100%" onclick="login()">Login</button></div>`;return}
 if(!ready){$('#app').innerHTML=hd+'<div class="card m">Loading…</div>';return}
 if(role==='pending'){$('#nav').innerHTML='';$('#app').innerHTML=hd+'<div class="card"><h1>Approval pending</h1><p class="m">Aapka account bana hai. Admin se approve karwao.</p></div>';return}
 if(!SETUP){$('#nav').innerHTML='';$('#app').innerHTML=hd+wzv();return}
 if(tab==='admin'&&!isAdmin())tab='home';
 $('#nav').innerHTML=RECON?'':[['home','🏠','Home'],['daily','📝','Daily Entry'],['history','📊','History']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')"><span>${i}</span>${l}</button>`).join('');
 const t=RECON?'daily':tab;$('#app').innerHTML=hd+{home,daily,history,admin}[t]();
 if(t==='daily'&&!RECON&&DAY&&DAY.status==='open')LINES.forEach(l=>$('#c'+l.product_id)&&calc(l.product_id,l));else if(RECON)RLINES.forEach(l=>$('#c'+l.product_id)&&calc(l.product_id,l));else if(t==='daily'&&DAY&&DAY.status==='closed'&&!DAY.prep_done)P.forEach(p=>$('#pc'+p.id)&&pcalc(p.id))}
(async()=>{render();try{const s=JSON.parse(localStorage.getItem('bsm_s')||'null');if(s){rt=s.rt;uid=s.uid;if(await refresh())await loadAll();else logout()}}catch(e){toast(emsg(e));render()}
 setInterval(()=>{if(tok&&!document.hidden&&!busyA&&!$('#sheet')&&!(document.activeElement&&document.activeElement.tagName==='INPUT')&&navigator.onLine)loadAll().catch(()=>{})},8000);
 addEventListener('online',render);addEventListener('offline',render);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
